version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release before proposing it, so a compromised version is usually
    # caught first. Matches pnpm's minimumReleaseAge.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      # Node types follow the Node 24 runtime pinned in .nvmrc and devEngines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports only TypeScript below 6.1; bump both together by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
