name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal code sample, or a link to a repository or StackBlitz.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "@boltronx/solid-ui and solid-js versions"
      placeholder: "@boltronx/solid-ui 0.1.0, solid-js 1.9.10"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Android 15
