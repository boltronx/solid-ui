name: Clean up workflow runs

# Deletes completed workflow runs older than a week, so the Actions tab only shows recent history.
# Release runs are kept: each npm provenance statement links to the run that built that version.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Delete completed runs older than this many days
        type: number
        default: 7

permissions: {}

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DAYS: ${{ inputs.days || 7 }}
      KEEP_WORKFLOW: .github/workflows/release.yml
    steps:
      - name: Delete runs
        run: |
          if [[ ! "$DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error::days must be a whole number, got: $DAYS"
            exit 1
          fi
          cutoff=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)

          # Collect the ids first, so deleting doesn't shift the pages being read.
          gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f created="<$cutoff" -f status=completed -f per_page=100 \
            --jq '.workflow_runs[] | select(.path | startswith(env.KEEP_WORKFLOW) | not) | .id' \
            > run-ids.txt

          deleted=0
          failed=0
          while read -r id; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < run-ids.txt

          echo "Deleted $deleted runs from before $cutoff ($failed failed)." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Deleted $deleted runs older than $DAYS days ($failed failed)."
