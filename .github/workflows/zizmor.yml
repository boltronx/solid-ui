name: Workflow security

# zizmor audits the GitHub Actions workflows: unpinned actions, template injection, excessive
# permissions, credential leaks and more.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Uploads findings to the Security tab on pushes to main
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Pull requests (including from forks) can't upload results, so findings fail the job
          # there instead; pushes to main report to the Security tab.
          advanced-security: ${{ github.event_name == 'push' }}
