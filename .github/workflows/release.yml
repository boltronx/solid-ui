name: Release

# Two ways to release; see CONTRIBUTING.md for setup.
#  - Automatic: merge a change to packages/solid-ui/package.json that sets a new version.
#  - Manual: run this workflow from the Actions tab, optionally with a version bump.
# Every step is idempotent, so re-running a failed release finishes it without duplicating work.
on:
  push:
    branches: [main]
    paths: [packages/solid-ui/package.json]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Bump: patch, minor, major, prepatch, preminor, premajor, prerelease, or an exact version
          like 1.2.0. Leave empty to publish the version already in package.json.
        type: string
        default: ""
      dist-tag:
        description: npm dist-tag. "auto" means latest for releases, next for prereleases.
        type: choice
        options: [auto, latest, next, beta]
        default: auto

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Check for a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A manual run always continues: it may bump, or finish a release that failed halfway.
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./packages/solid-ui/package.json').version")
          if npm view "@boltronx/solid-ui@$version" version >/dev/null 2>&1; then
            echo "::notice::v$version is already on npm; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Checks
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment to approve each release.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@boltronx/solid-ui
    permissions:
      # Push the version commit and tag, create the GitHub release
      contents: write
      # npm trusted publishing (no npm token) and provenance
      id-token: write
    env:
      VERSION_INPUT: ${{ inputs.version }}
      DIST_TAG_INPUT: ${{ inputs.dist-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a release never restores state another run wrote.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        if: inputs.version != ''
        working-directory: packages/solid-ui
        run: |
          pattern='^(patch|minor|major|prepatch|preminor|premajor|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$VERSION_INPUT" =~ $pattern ]]; then
            echo "::error::Not a valid version or bump: $VERSION_INPUT"
            exit 1
          fi
          preid=next
          [[ "$DIST_TAG_INPUT" == "beta" ]] && preid=beta
          npm version "$VERSION_INPUT" --no-git-tag-version --preid "$preid"

      - name: Resolve version and dist-tag
        id: meta
        working-directory: packages/solid-ui
        run: |
          version=$(node -p "require('./package.json').version")
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          tag="${DIST_TAG_INPUT:-auto}"
          if [[ "$tag" == "auto" ]]; then
            if [[ "$prerelease" == "true" ]]; then tag=next; else tag=latest; fi
          fi
          if [[ "$prerelease" == "true" && "$tag" == "latest" ]]; then
            echo "::error::Prerelease $version can't be published as latest."
            exit 1
          fi
          published=false
          npm view "@boltronx/solid-ui@$version" version >/dev/null 2>&1 && published=true
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$version as '$tag' (already on npm: $published)"

      - name: Build
        run: pnpm --filter @boltronx/solid-ui build

      - name: Push version commit and tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUMPED: ${{ inputs.version != '' }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$BUMPED" == "true" ]]; then
            git commit --all --message "chore(release): v$VERSION"
            git push "$remote" HEAD:main
          fi
          if git ls-remote --exit-code --tags "$remote" "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists."
          else
            git tag --annotate "v$VERSION" --message "v$VERSION"
            git push "$remote" "v$VERSION"
          fi

      - name: Publish to npm
        if: steps.meta.outputs.published == 'false'
        working-directory: packages/solid-ui
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
        run: npm publish --access public --provenance --tag "$TAG"

      - name: Create GitHub release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag "${flags[@]}"
