name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # The release workflow runs these checks before publishing.
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check spelling
        run: pnpm spellcheck

      - name: Lint
        run: pnpm lint

      # The docs typecheck against the built package, the way an app would use it.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      # A real SolidStart build: the page renders on the server, and its form posts to a server
      # action without JavaScript. It uses the library built in the Build step above, so it must
      # run after it.
      - name: Test with SolidStart (SSR and server actions)
        run: pnpm test:start:fixture

      - name: Check the published package
        run: pnpm lint:package
